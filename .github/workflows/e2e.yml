name: E2E

on:
  workflow_call:
    inputs:
        repo:
          required: true
          type: string
        artifacts:
          required: false
          type: string
        ginkgoLabelFilter:
          required: false
          type: string

env:
  GO_REQUIRED_MIN_VERSION: ''

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install DevSpace
        uses: loft-sh/setup-devspace@e2ae721371201cc5c978792675fac91d985593a6 # main

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.1

      - name: Test E2E
        run: |
          cd ${{ inputs.repo }}
          LABEL_FILTER=${{ inputs.ginkgoLabelFilter }} make test-e2e

      - name: Upload Artifacts
        if: |
          (success() || failure()) && inputs.artifacts != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: ${{ inputs.artifacts }}
          if-no-files-found: ignore
          retention-days: 7