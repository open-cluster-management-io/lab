---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - open-cluster-management.io
  resources:
  - hubs
  - spokes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - open-cluster-management.io
  resources:
  - hubs/finalizers
  - spokes/finalizers
  verbs:
  - update
- apiGroups:
  - open-cluster-management.io
  resources:
  - hubs/status
  - spokes/status
  verbs:
  - get
  - patch
  - update
