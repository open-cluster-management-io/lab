                    description: |-
                      List of AWS EKS ARN patterns so any EKS clusters with these patterns will be auto accepted to join with hub cluster.
                      Example pattern: "arn:aws:eks:us-west-2:123456789013:cluster/.*"
                    items:
                      type: string
                    type: array
                  driver:
                    default: csr
                    description: |-
                      The registration authentication driver to use.
                      Options are:
                       - csr: Use the default CSR-based registration authentication.
                       - awsirsa: Use AWS IAM Role for Service Accounts (IRSA) registration authentication.
                       - grpc: Use gRPC registration (requires grpc.join with joinServer and certificateAuthority).
                    enum:
                    - csr
                    - awsirsa
                    - grpc
                    type: string
                  grpc:
                    description: GRPC holds gRPC-specific settings for clusteradm
                      init and join.
                    properties:
                      autoApprovedIdentities:
                        description: AutoApprovedIdentities are passed to clusteradm
                          init --auto-approved-grpc-identities (comma-separated list).
                        items:
                          type: string
                        type: array
                      endpointType:
                        default: hostname
                        description: EndpointType is the gRPC server endpoint type
                          for clusteradm init (--grpc-endpoint-type).
                        enum:
                        - hostname
                        - loadBalancer
                        type: string
                      server:
                        description: Server is the address for clusteradm init --grpc-server
                          when configuring the hub.
                        type: string
                    type: object
                  hubClusterARN:
                    description: The Hub cluster ARN for awsirsa registration authentication.
                      Required when Type is awsirsa, otherwise ignored.
                    type: string
                type: object
              singleton:
                description: |-
                  Singleton control plane configuration. If provided, deploy a singleton control plane instead of clustermanager.
                  This is an alpha stage flag.
                properties:
                  helm:
                    description: |-
                      Helm configuration for the multicluster-controlplane Helm chart.
                      For now https://open-cluster-management.io/helm-charts/ocm/multicluster-controlplane is always used - no private registry support.
                      See: https://github.com/open-cluster-management-io/multicluster-controlplane/blob/main/charts/multicluster-controlplane/values.yaml
                    properties:
                      set:
                        description: Comma-separated Helm values, e.g., key1=val1,key2=val2.
                        items:
                          type: string
                        type: array
                      setJson:
                        description: Comma-separated Helm JSON values, e.g., key1=jsonval1,key2=jsonval2.
                        items:
                          type: string
                        type: array
                      setLiteral:
                        description: Comma-separated Helm literal STRING values.
                        items:
                          type: string
                        type: array
                      setString:
                        description: Comma-separated Helm STRING values, e.g., key1=val1,key2=val2.
                        items:
                          type: string
                        type: array
                      values:
                        description: Raw, YAML-formatted Helm values.
                        type: string
                    type: object
                  name:
                    default: singleton-controlplane
                    description: The name of the singleton control plane.
                    type: string
                type: object
              timeout:
                default: 300
                description: Timeout is the timeout in seconds for all clusteradm
                  operations, including init, accept, join, upgrade, etc.
                type: integer
            required:
            - kubeconfig
            type: object
          status:
            description: status defines the observed state of Hub
            properties:
              clusterManagerHash:
                default: ""
                description: ClusterManagerHash is a hash of the Hub's merged cluster-manager
                  Helm chart values (.spec.clusterManager.values and valuesFrom).
                type: string
              conditions:
                description: Conditions are the current conditions of the Hub.
                items:
                  description: Condition describes the state of a FleetConfig.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                    wantStatus:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  - wantStatus
                  type: object
                type: array
              grpcServer:
                description: |-
                  GRPCServer is the observed gRPC listen address (host:port) from the hub cluster's cluster-manager-grpc-server
                  LoadBalancer ingress when registrationAuth.grpc.endpointType is loadBalancer. When endpoint type is hostname,
                  spokes use spec.registrationAuth.grpc.server instead and this field may be empty.
                type: string
              grpcServerCA:
                description: |-
                  GRPCServerCA is the observed PEM CA bundle from the hub cluster's open-cluster-management-hub/ca-bundle-configmap
                  (data key ca-bundle.crt).
                type: string
              installedHubAddOns:
                items:
                  description: InstalledHubAddOn tracks metadata for each hubAddon
                    that is successfully installed on the hub.
                  properties:
                    bundleVersion:
                      description: BundleVersion is the bundle version used when installing
                        the addon.
                      type: string
                    name:
                      description: Name is the name of the addon.
                      type: string
                    namespace:
                      description: Namespace is the namespace that the addon was installed
                        into.
                      type: string
                  required:
                  - bundleVersion
                  - name
                  type: object
                type: array
              phase:
                description: Phase is the current phase of the Hub reconcile.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
